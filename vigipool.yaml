
# AnteaVS Configuration Begin

- sensor:
    name: RSSI
    state_topic: "anteavs_XXXXXXXXXXX/i8_r/rssi/info/reported"
    unique_id: anteavs_XXXXXXXXXXX.rssi
    enabled_by_default: false
    device:
        configuration_url: https://www.ccei-pool.com/fr/produit/antea-vs
        manufacturer: CCEI
        model: AnteaVS
        name: AnteaVS
        identifiers: AnteaVS

- sensor:
    name: ID
    state_topic: "anteavs_XXXXXXXXXXX/s44_r/device_id/info/reported"
    unique_id: anteavs_XXXXXXXXXXX.device_id
    enabled_by_default: false
    device:
        configuration_url: https://www.ccei-pool.com/fr/produit/antea-vs
        manufacturer: CCEI
        model: AnteaVS
        name: AnteaVS
        identifiers: AnteaVS

- sensor:
    name: Numéro de série
    state_topic: "anteavs_XXXXXXXXXXX/s33_r/serial_num/info/reported"
    unique_id: anteavs_XXXXXXXXXXX.serial_num
    enabled_by_default: false
    device:
        configuration_url: https://www.ccei-pool.com/fr/produit/antea-vs
        manufacturer: CCEI
        model: AnteaVS
        name: AnteaVS
        identifiers: AnteaVS

- sensor:
    name: Version du firmware
    state_topic: "anteavs_XXXXXXXXXXX/u16_r/sw_vers/info/reported"
    unique_id: anteavs_XXXXXXXXXXX.sw_vers
    enabled_by_default: false
    value_template: >-
        {{ float('%0x' % value | int(0))/100 }}
    device:
        configuration_url: https://www.ccei-pool.com/fr/produit/antea-vs
        manufacturer: CCEI
        model: AnteaVS
        name: AnteaVS
        identifiers: AnteaVS

- sensor:
    name: Version du matériel
    state_topic: "anteavs_XXXXXXXXXXX/u8_r/hw_vers/info/reported"
    unique_id: anteavs_XXXXXXXXXXX.hw_vers
    enabled_by_default: false
    device:
        configuration_url: https://www.ccei-pool.com/fr/produit/antea-vs
        manufacturer: CCEI
        model: AnteaVS
        name: AnteaVS
        identifiers: AnteaVS

- sensor:
    name: Vitesse de filtration
    state_topic: anteavs_XXXXXXXXXXX/u8_w/filt_speed/info/reported
    unique_id: anteavs_XXXXXXXXXXX.filt_speed
    value_template: >-
        {%- set mapper = {
          '0': 'Arrêtée',
          '1': 'Éco',
          '2': 'Normale',
          '3': 'Turbo',
          '129': 'Éco',
          '130': 'Normale',
          '131': 'Turbo'
        } -%}
        {{ mapper.get(value, 'unknown (' ~ value ~ ')') }}
    device:
        configuration_url: https://www.ccei-pool.com/fr/produit/antea-vs
        manufacturer: CCEI
        model: AnteaVS
        name: AnteaVS
        identifiers: AnteaVS

- select:
    name: Vitesse de filtration
    state_topic: anteavs_XXXXXXXXXXX/u8_w/filt_speed/info/reported
    command_topic: "anteavs_XXXXXXXXXXX/u8_w/filt_speed/info/desired"
    unique_id: anteavs_XXXXXXXXXXX.filt_speed_select
    options:
        - "Auto"
        - "Éco"
        - "Normale"
        - "Turbo"
    command_template: >-
        {%- set mapper = {
          'Auto': 3,
          'Éco': 129,
          'Normale': 130,
          'Turbo': 131
        } -%}
        {{ mapper.get(value, 3) }}
    value_template: >-
        {%- set mapper = {
          '0': 'Auto',
          '1': 'Auto',
          '2': 'Auto',
          '3': 'Auto',
          '129': 'Éco',
          '130': 'Normale',
          '131': 'Turbo'
        } -%}
        {{ mapper.get(value, 'unknown (' ~ value ~ ')') }}
    device:
        configuration_url: https://www.ccei-pool.com/fr/produit/antea-vs
        manufacturer: CCEI
        model: AnteaVS
        name: AnteaVS
        identifiers: AnteaVS

- switch:
    name: Mode Skimmer
    state_topic: anteavs_XXXXXXXXXXX/u8_w/filt_skim/info/reported
    command_topic: "anteavs_XXXXXXXXXXX/u8_w/filt_skim/info/desired"
    unique_id: anteavs_XXXXXXXXXXX.filt_skim
    payload_off: "128"
    payload_on: "1"
    state_on: "129"
    state_off: "0"
    device:
        configuration_url: https://www.ccei-pool.com/fr/produit/antea-vs
        manufacturer: CCEI
        model: AnteaVS
        name: AnteaVS
        identifiers: AnteaVS

# AnteaVS Configuration End

